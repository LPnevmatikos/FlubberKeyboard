name: FlubberKeyboard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Flubber:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Shared/WordDeck.swift
      - path: Shared/Resources/words.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Flubber
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: FlubberKeyboardExtension
        embed: true
  FlubberKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: [Info.plist]
      - path: Shared/WordDeck.swift
      - path: Shared/Resources/words.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Flubber.Keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  Flubber:
    build:
      targets:
        Flubber: all
        FlubberKeyboardExtension: all
    run:
      config: Debug
